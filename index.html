<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat App</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        #chatContainer {
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            width: 300px;
            height: 400px;
            overflow-y: auto;
            position: relative;
        }
        #messageInput {
            width: calc(100% - 60px);
        }
        #sendButton {
            width: 50px;
        }
    </style>
</head>
<body>

<h1>Chat Application</h1>
<label for="nickname">Enter your nickname: </label>
<input type="text" id="nickname" placeholder="Nickname" required>
<button onclick="openChat()">Open Chat</button>

<script>
    // Your Firebase configuration
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let chatWindow;

    function openChat() {
        const nickname = document.getElementById('nickname').value;
        if (!nickname) {
            alert('Please enter a nickname');
            return;
        }

        if (chatWindow && !chatWindow.closed) {
            chatWindow.focus();
            return;
        }

        chatWindow = window.open('', 'ChatWindow', 'width=400,height=500');

        chatWindow.document.write(`
            <html>
                <head>
                    <title>Chat Window</title>
                    <style>
                        body {
                            font-family: Arial, sans-serif;
                        }
                        #chatContainer {
                            background: white;
                            border: 1px solid #ccc;
                            border-radius: 5px;
                            padding: 10px;
                            width: 100%;
                            height: 400px;
                            overflow-y: auto;
                        }
                        #messageInput {
                            width: calc(100% - 60px);
                        }
                        #sendButton {
                            width: 50px;
                        }
                    </style>
                </head>
                <body>
                    <h2>Chat</h2>
                    <div id="chatContainer"></div>
                    <input type="text" id="messageInput" placeholder="Type your message...">
                    <button id="sendButton" onclick="sendMessage()">Send</button>

                    <script>
                        const chatContainer = document.getElementById('chatContainer');
                        const messageInput = document.getElementById('messageInput');

                        // Load messages
                        firebase.database().ref('messages').on('child_added', function(snapshot) {
                            const data = snapshot.val();
                            const messageElement = document.createElement('div');
                            messageElement.textContent = data.nickname + ': ' + data.message;
                            chatContainer.appendChild(messageElement);
                            chatContainer.scrollTop = chatContainer.scrollHeight;
                        });

                        function sendMessage() {
                            const message = messageInput.value;
                            if (message) {
                                const newMessageRef = firebase.database().ref('messages').push();
                                newMessageRef.set({
                                    nickname: '${nickname}',
                                    message: message
                                });
                                messageInput.value = '';
                            }
                        }
                    </script>
                </body>
            </html>
        `);

        chatWindow.document.close(); // Close the document to finish loading
    }
</script>

</body>
</html>
