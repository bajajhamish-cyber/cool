<!DOCTYPE html>
<html>
<head>
<title>Mega Game Hub</title>
<style>
body {
  font-family: sans-serif;
  background-color: #f0f0f0;
  margin: 0;
  padding: 0;
}

#game-selector {
  background-color: #333;
  color: white;
  padding: 10px;
  text-align: center;
}

#game-selector button {
  background-color: #4CAF50;
  color: white;
  border: none;
  padding: 10px 20px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
}

#game-container {
  width: 800px;
  margin: 20px auto;
  background-color: white;
  padding: 20px;
  border-radius: 5px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

canvas {
  display: block;
  margin: 0 auto;
  border: 1px solid #ccc;
}

/* Styles for specific games can be added here */
#snake-canvas { width: 400px; height: 400px; }
#breakout-canvas { width: 400px; height: 300px; }
#geometry-dash-canvas { width: 600px; height: 200px; }
#fps-canvas { width: 600px; height: 400px; }

</style>
</head>
<body>

<div id="game-selector">
  <button onclick="showGame('snake')">Snake</button>
  <button onclick="showGame('breakout')">Breakout</button>
  <button onclick="showGame('geometry-dash')">Geometry Dash</button>
  <button onclick="showGame('fps')">FPS</button>
  <button onclick="showGame('memory')">Memory Game</button>
  <button onclick="showGame('simon')">Simon Says</button>
</div>

<div id="game-container">
  <canvas id="snake-canvas" style="display:none;"></canvas>
  <canvas id="breakout-canvas" style="display:none;"></canvas>
  <canvas id="geometry-dash-canvas" style="display:none;"></canvas>
  <canvas id="fps-canvas" style="display:none;"></canvas>
  <div id="memory-game" style="display: none;"></div>
  <div id="simon-game" style="display: none;"></div>
</div>

<script>
let currentGame = null;

function hideAllGames() {
  document.getElementById('snake-canvas').style.display = 'none';
  document.getElementById('breakout-canvas').style.display = 'none';
  document.getElementById('geometry-dash-canvas').style.display = 'none';
  document.getElementById('fps-canvas').style.display = 'none';
  document.getElementById('memory-game').style.display = 'none';
  document.getElementById('simon-game').style.display = 'none';

  if (currentGame && currentGame.stop) {
        currentGame.stop(); // Stop the previous game if it has a stop function
    }
}

function showGame(gameId) {
  hideAllGames();
  document.getElementById(gameId + '-canvas').style.display = 'block'; // Assumes canvas naming convention
  document.getElementById(gameId + '-game').style.display = 'block'; // Assumes div naming convention

  switch (gameId) {
    case 'snake':
      currentGame = initSnake();
      break;
    case 'breakout':
      currentGame = initBreakout();
      break;
    case 'geometry-dash':
      currentGame = initGeometryDash();
      break;
    case 'fps':
      currentGame = initFPS();
      break;
    case 'memory':
        currentGame = initMemoryGame();
        break;
    case 'simon':
        currentGame = initSimonSays();
        break;
  }
}

// --- Snake Game ---
function initSnake() {
  const canvas = document.getElementById('snake-canvas');
  const ctx = canvas.getContext('2d');
  const box = 20;
  let snake = [];
  snake[0] = { x: 9 * box, y: 10 * box };
  let food = { x: Math.floor(Math.random() * 17 + 1) * box, y: Math.floor(Math.random() * 15 + 3) * box };
  let score = 0;
  let d;

  document.addEventListener("keydown", direction);

  function direction(event) {
    let key = event.keyCode;
    if (key == 37 && d != "RIGHT") d = "LEFT";
    else if (key == 38 && d != "DOWN") d = "UP";
    else if (key == 39 && d != "LEFT") d = "RIGHT";
    else if (key == 40 && d != "UP") d = "DOWN";
  }

  function collision(head, array) {
    for (let i = 0; i < array.length; i++) {
      if (head.x == array[i].x && head.y == array[i].y) return true;
    }
    return false;
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < snake.length; i++) {
      ctx.fillStyle = (i == 0) ? "green" : "white";
      ctx.fillRect(snake[i].x, snake[i].y, box, box);
      ctx.strokeStyle = "black";
      ctx.strokeRect(snake[i].x, snake[i].y, box, box);
    }

    ctx.fillStyle = "red";
    ctx.fillRect(food.x, food.y, box, box);

    let snakeX = snake[0].x;
    let snakeY = snake[0].y;

    if (d == "LEFT") snakeX -= box;
    if (d == "UP") snakeY -= box;
    if (d == "RIGHT") snakeX += box;
    if (d == "DOWN") snakeY += box;

    if (snakeX == food.x && snakeY == food.y) {
      score++;
      food = { x: Math.floor(Math.random() * 17 + 1) * box, y: Math.floor(Math.random() * 15 + 3) * box };
    } else {
      snake.pop();
    }

    let newHead = { x: snakeX, y: snakeY };

    if (snakeX < 0 || snakeX > 17 * box || snakeY < 0 || snakeY > 17 * box || collision(newHead, snake)) {
      clearInterval(game);
    }

    snake.unshift(newHead);

    ctx.fillStyle = "white";
    ctx.font = "45px Changa one";
    ctx.fillText(score, 2 * box, 1.6 * box);
  }

  let game = setInterval(draw, 100);

  return {
    stop: () => clearInterval(game)
  };
}

// --- Breakout Game ---
function initBreakout() {
  const canvas = document.getElementById('breakout-canvas');
  const ctx = canvas.getContext('2d');
  let paddleX = canvas.width / 2;
  const paddleHeight = 10;
  const paddleWidth = 75;
  let ballX = canvas.width / 2;
  let ballY = canvas.height - 30;
  let ballDX = 2;
  let ballDY = -2;
  let score = 0;
  let bricks = [];
  const brickRowCount = 3;
  const brickColumnCount = 5;
  const brickWidth = 75;
  const brickHeight = 20;
  const brickPadding = 10;
  const brickOffsetTop = 30;
  const brickOffsetLeft = 30;
  let rightPressed = false;
  let leftPressed = false;

  document.addEventListener("keydown", keyDownHandler, false);
  document.addEventListener("keyup", keyUpHandler, false);

  function keyDownHandler(e) {
    if (e.key == "Right" || e.key == "ArrowRight") {
      rightPressed = true;
    } else if (e.key == "Left" || e.key == "ArrowLeft") {
      leftPressed = true;
    }
  }

  function keyUpHandler(e) {
    if (e.key == "Right" || e.key == "ArrowRight") {
      rightPressed = false;
    } else if (e.key == "Left" || e.key == "ArrowLeft") {
      leftPressed = false;
    }
  }

  for (let c = 0; c < brickColumnCount; c++) {
    bricks[c] = [];
    for (let r = 0; r < brickRowCount; r++) {
      bricks[c][r] = { x: 0, y: 0, status: 1 };
    }
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ballX, ballY, 10, 0, Math.PI * 2);
    ctx.fillStyle = "#0095DD";
    ctx.fill();
    ctx.closePath();
  }

  function drawPaddle() {
    ctx.beginPath();
    ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
    ctx.fillStyle = "#0095DD";
    ctx.fill();
    ctx.closePath();
  }

  function drawBricks() {
    for (let c = 0; c < brickColumnCount; c++) {
      for (let r = 0; r < brickRowCount; r++) {
        if (bricks[c][r].status == 1) {
          const brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
          const brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
          bricks[c][r].x = brickX;
          bricks[c][r].y = brickY;
          ctx.beginPath();
          ctx.rect(brickX, brickY, brickWidth, brickHeight);
          ctx.fillStyle = "#0095DD";
          ctx.fill();
          ctx.closePath();
        }
      }
    }
  }

  function collisionDetection() {
    for (let c = 0; c < brickColumnCount; c++) {
      for (let r = 0; r < brickRowCount; r++) {
        const b = bricks[c][r];
        if (b.status == 1) {
          if (ballX > b.x && ballX < b.x + brickWidth && ballY > b.y && ballY < b.y + brickHeight) {
            ballDY = -ballDY;
            b.status = 0;
            score++;
            if (score == brickRowCount * brickColumnCount) {
              alert("YOU WIN, CONGRATULATIONS!");
              document.location.reload();
            }
          }
        }
      }
    }
  }

  function drawScore() {
    ctx.font = "16px Arial";
    ctx.fillStyle = "#0095DD";
    ctx.fillText("Score: " + score, 8, 20);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBricks();
    drawBall();
    drawPaddle();
    drawScore();
    collisionDetection();

    if (ballX + ballDX > canvas.width - 10 || ballX + ballDX < 10) {
      ballDX = -ballDX;
    }
    if (ballY + ballDY < 10) {
      ballDY = -ballDY;
    } else if (ballY + ballDY > canvas.height - 10) {
      if (ballX > paddleX && ballX < paddleX + paddleWidth) {
        ballDY = -ballDY;
      } else {
        alert("GAME OVER");
        document.location.reload();
      }
    }

    if (rightPressed && paddleX < canvas.width - paddleWidth) {
      paddleX += 7;
    } else if (leftPressed && paddleX > 0) {
      paddleX -= 7;
    }

    ballX += ballDX;
    ballY += ballDY;
    requestAnimationFrame(draw);
  }

  drawBricks();
  draw();

  return {
    stop: () => cancelAnimationFrame(draw)
  };
}

// --- Geometry Dash-like Game ---
function initGeometryDash() {
  const canvas = document.getElementById('geometry-dash-canvas');
  const ctx = canvas.getContext('2d');
  let playerX = 50;
  let playerY = 150;
  let playerSize = 20;
  let obstacleX = 550;
  let obstacleY = 150;
  let obstacleWidth = 30;
  let obstacleHeight = 50;
  let isJumping = false;
  let jumpHeight = 10;
  let gravity = 0.5;
  let velocityY = 0;
  let score = 0;

  document.addEventListener("keydown", jump);

  function jump(event) {
    if (event.code === "Space" && !isJumping) {
      isJumping = true;
      velocityY = -jumpHeight;
    }
  }

  function drawPlayer() {
    ctx.fillStyle = "blue";
    ctx.fillRect(playerX, playerY, playerSize, playerSize);
  }

  function drawObstacle() {
    ctx.fillStyle = "red";
    ctx.fillRect(obstacleX, obstacleY, obstacleWidth, obstacleHeight);
  }

  function collisionDetection() {
    if (playerX + playerSize > obstacleX &&
      playerX < obstacleX + obstacleWidth &&
      playerY + playerSize > obstacleY &&
      playerY < obstacleY + obstacleHeight) {
      alert("Game Over! Score: " + score);
      document.location.reload();
    }
  }

  function updateScore() {
    score++;
  }

  function drawScore() {
    ctx.fillStyle = "black";
    ctx.font = "16px Arial";
    ctx.fillText("Score: " + score, 10, 20);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawPlayer();
    drawObstacle();
    drawScore();
    collisionDetection();

    if (isJumping) {
      playerY += velocityY;
      velocityY += gravity;

      if (playerY >= 150 - playerSize) {
        playerY = 150 - playerSize;
        isJumping = false;
      }
    }

    obstacleX -= 5;
    if (obstacleX < -obstacleWidth) {
      obstacleX = canvas.width;
      obstacleY = 150;
      updateScore();
    }

    requestAnimationFrame(draw);
  }

  draw();

  return {
    stop: () => cancelAnimationFrame(draw)
  };
}

// --- FPS Game (Very Basic) ---
function initFPS() {
  const canvas = document.getElementById('fps-canvas');
  const ctx = canvas.getContext('2d');
  let playerX = canvas.width / 2;
  let playerY = canvas.height / 2;
  let playerSize = 20;
  let enemies = [];
  let score = 0;

  function createEnemy() {
    const enemyX = Math.random() * canvas.width;
    const enemyY = Math.random() * canvas.height;
    const enemySize = 15;
    enemies.push({ x: enemyX, y: enemyY, size: enemySize });
  }

  setInterval(createEnemy, 2000);

  canvas.addEventListener("click", (event) => {
    const rect = canvas.getBoundingClientRect();
    const clickX = event.clientX - rect.left;
    const clickY = event.clientY - rect.top;

    for (let i = 0; i < enemies.length; i++) {
      const enemy = enemies[i];
      if (clickX > enemy.x && clickX < enemy.x + enemy.size &&
        clickY > enemy.y && clickY < enemy.y + enemy.size) {
        enemies.splice(i, 1);
        score++;
        break;
      }
    }
  });

  function drawPlayer() {
    ctx.fillStyle = "green";
    ctx.fillRect(playerX - playerSize / 2, playerY - playerSize / 2, playerSize, playerSize);
  }

  function drawEnemies() {
    ctx.fillStyle = "red";
    for (const enemy of enemies) {
      ctx.fillRect(enemy.x, enemy.y, enemy.size, enemy.size);
    }
  }

  function drawScore() {
    ctx.fillStyle = "black";
    ctx.font = "16px Arial";
    ctx.fillText("Score: " + score, 10, 20);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawPlayer();
    drawEnemies();
    drawScore();
    requestAnimationFrame(draw);
  }

  draw();

  return {
    stop: () => cancelAnimationFrame(draw)
  };
}

// --- Memory Game ---
function initMemoryGame() {
    const gameContainer = document.getElementById('memory-game');
    gameContainer.innerHTML = ''; // Clear previous content

    const cardsArray = ['A', 'A', 'B', 'B', 'C', 'C', 'D', 'D'];
    cardsArray.sort(() => 0.5 - Math.random());

    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;

    const createCard = (card, index) => {
        const cardElement = document.createElement('div');
        cardElement.classList.add('memory-card');
        cardElement.dataset.framework = card;
        cardElement.innerHTML = `
            <div class="front-face">${card}</div>
            <div class="back-face"></div>
        `;

        cardElement.addEventListener('click', flipCard);
        return cardElement;
    };

    function flipCard() {
        if (lockBoard) return;
        if (this === firstCard) return;

        this.classList.add('flip');

        if (!firstCard) {
            firstCard = this;
            return;
        }

        secondCard = this;
        lockBoard = true;

        checkForMatch();
    }

    function checkForMatch() {
        let isMatch = firstCard.dataset.framework === secondCard.dataset.framework;

        isMatch ? disableCards() : unflipCards();
    }

    function disableCards() {
        firstCard.removeEventListener('click', flipCard);
        secondCard.removeEventListener('click', flipCard);

        resetBoard();
    }

    function unflipCards() {
        setTimeout(() => {
            firstCard.classList.remove('flip');
            secondCard.classList.remove('flip');

            resetBoard();
        }, 1000);
    }

    function resetBoard() {
        [firstCard, secondCard, lockBoard] = [null, null, false];
    }

    cardsArray.forEach((card, index) => {
        const cardElement = createCard(card, index);
        gameContainer.appendChild(cardElement);
    });

    return {
        stop: () => {
            // Clean up event listeners or any ongoing processes
            const cards = gameContainer.querySelectorAll('.memory-card');
            cards.forEach(card => card.removeEventListener('click', flipCard));
            gameContainer.innerHTML = ''; // Clear the game board
        }
    };
}

// --- Simon Says Game ---
function initSimonSays() {
    const gameContainer = document.getElementById('simon-game');
    gameContainer.innerHTML = ''; // Clear previous content

    const colors = ['red', 'blue', 'green', 'yellow'];
    let sequence = [];
    let userSequence = [];
    let level = 0;
    let gameStarted = false;

    const createButton = (color) => {
        const button = document.createElement('button');
        button.classList.add('simon-button');
        button.style.backgroundColor = color;
        button.dataset.color = color;
        button.addEventListener('click', handleButtonClick);
        return button;
    };

    const createStartButton = () => {
        const startButton = document.createElement('button');
        startButton.textContent = 'Start Game';
        startButton.addEventListener('click', startGame);
        return startButton;
    };

    const displaySequence = async () => {
        for (const color of sequence) {
            const button = gameContainer.querySelector(`[data-color="${color}"]`);
            await highlightButton(button);
        }
    };

    const highlightButton = (button) => {
        return new Promise(resolve => {
            button.classList.add('highlight');
            setTimeout(() => {
                button.classList.remove('highlight');
                setTimeout(resolve, 250); // Delay between highlights
            }, 500);
        });
    };

    const handleButtonClick = (event) => {
        if (!gameStarted) return;

        const color = event.target.dataset.color;
        userSequence.push(color);
        highlightButton(event.target);

        const index = userSequence.length - 1;
        if (userSequence[index] !== sequence[index]) {
            endGame();
            return;
        }

        if (userSequence.length === sequence.length) {
            setTimeout(nextLevel, 1000);
        }
    };

    const nextLevel = () => {
        userSequence = [];
        level++;
        sequence.push(colors[Math.floor(Math.random() * colors.length)]);
        displaySequence();
    };

    const startGame = () => {
        gameStarted = true;
        sequence = [];
        userSequence = [];
        level = 0;
        nextLevel();
    };

    const endGame = () => {
        alert(`Game Over! You reached level ${level}`);
        gameStarted = false;
    };

    // Create buttons and append to the game container
    colors.forEach(color => {
        const button = createButton(color);
        gameContainer.appendChild(button);
    });

    const startButton = createStartButton();
    gameContainer.appendChild(startButton);

    return {
        stop: () => {
            // Clean up event listeners and reset the game state
            const buttons = gameContainer.querySelectorAll('.simon-button');
            buttons.forEach(button => button.removeEventListener('click', handleButtonClick));
            startButton.removeEventListener('click', startGame);
            gameContainer.innerHTML = ''; // Clear the game board
            gameStarted = false;
        }
    };
}

</script>

</body>
</html>
